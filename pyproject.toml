[project]
name = "ipcalc"
version = "0.1.0"
description = "IPv4 / IPv6 のアドレス・マスクからネットワーク情報を計算するCLIツール"
requires-python = ">=3.14"
dependencies = [
    "common",
    "rich>=13",
]

[project.scripts]
ipcalc = "ipcalc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ipcalc"]

[tool.uv.sources]
common = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
]
